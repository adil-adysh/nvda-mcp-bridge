[package]
name = "nvda-mcp-server"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json"] }
rmcp = { version = "0.3", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonschema = "0.18"
tokio = { version = "1.46", features = ["macros", "rt-multi-thread", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
# Explicitly disable LTO to avoid incompatible -C flags coming from toolchain/env.
# This prevents the "-C embed-bitcode=no and -C lto are incompatible" error on some setups.
lto = false

[dev-dependencies]
httpmock = "0.8.3"
