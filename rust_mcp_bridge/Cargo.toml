[package]
name = "nvda-mcp-server"
version = "0.10.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13", features = ["json"] }
rmcp = { version = "3.9", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
jsonschema = "0.61"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[profile.release]
# Explicitly disable LTO to avoid incompatible -C flags coming from toolchain/env.
# This prevents the "-C embed-bitcode=no and -C lto are incompatible" error on some setups.
lto = false

[dev-dependencies]
httpmock = "0.9"
