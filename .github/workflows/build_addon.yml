name: build-and-release-addon

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Rust
        uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
          profile: minimal

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install pre-commit scons markdown pytest pydantic jsonschema

      - name: Verify canonical protocol consistency
        run: |
          python scripts/generate_protocol.py --check

      - name: Run Python unit tests
        run: |
          pytest -v

      - name: Run Rust unit tests
        run: |
          cargo test --manifest-path rust_mcp_bridge/Cargo.toml

      - name: Build Rust MCP release binary
        run: |
          cargo build --release --manifest-path rust_mcp_bridge/Cargo.toml

      - name: Package bundled companion binary
        run: |
          python scripts/package_companion.py

      - name: Install gettext tools
        run: |
          choco install gettext -y
          $gettextBin = 'C:\Program Files\gettext-iconv\bin'
          "${gettextBin}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run code checks
        env:
          SKIP: no-commit-to-branch
        run: |
          pre-commit run --all-files

      - name: Build addon
        run: |
          scons
          scons pot

      - name: Validate packaged addon archive
        run: |
          python scripts/validate_addon_package.py

      - name: Stage release artifacts & generate SHA-256 checksums
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path "*.nvda-addon" -Destination dist\
          Copy-Item -Path "*.pot" -Destination dist\
          $exe = Get-ChildItem -Path rust_mcp_bridge/target -Recurse -Filter "nvda-mcp-server.exe" | Where-Object { $_.DirectoryName -like "*release*" } | Select-Object -First 1
          if (-not $exe) { throw 'nvda-mcp-server.exe release binary not found' }
          Copy-Item -Path $exe.FullName -Destination dist\
          $files = Get-ChildItem -Path dist\* -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' }
          $hashes = $files | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" }
          $hashes | Out-File -FilePath dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged_addon
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: packaged_addon
          path: release_artifacts

      - name: Extract version
        id: version
        run: |
          version="${GITHUB_REF#refs/tags/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff binary
        run: |
          DOWNLOAD_URL=$(python3 -c "import json, sys, urllib.request; req = urllib.request.Request('https://api.github.com/repos/orhun/git-cliff/releases/latest', headers={'User-Agent': 'github-actions'}); release = json.loads(urllib.request.urlopen(req).read()); assets = [asset['browser_download_url'] for asset in release['assets'] if 'x86_64-unknown-linux-gnu.tar.gz' in asset['browser_download_url']]; print(assets[0] if assets else sys.exit('No x86_64 linux asset found'))")
          echo "Installing git-cliff from ${DOWNLOAD_URL}"
          curl -sSL "$DOWNLOAD_URL" | tar xz -C /tmp
          sudo mv /tmp/git-cliff-*/git-cliff /usr/local/bin/git-cliff
          sudo chmod +x /usr/local/bin/git-cliff

      - name: Generate release notes
        run: |
          git-cliff --config cliff.toml --current --output RELEASE_NOTES.md
          printf '\n### SHA256 Checksums\n```\n' >> RELEASE_NOTES.md
          cat release_artifacts/SHA256SUMS.txt >> RELEASE_NOTES.md
          printf '```\n' >> RELEASE_NOTES.md

      - name: Debug release notes
        run: cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release_artifacts/*.nvda-addon
            release_artifacts/*.pot
            release_artifacts/nvda-mcp-server.exe
            release_artifacts/SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
