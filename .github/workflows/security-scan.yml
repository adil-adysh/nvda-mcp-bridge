name: security-scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  package_addon:
    runs-on: windows-latest
    outputs:
      addonFileName: ${{ steps.findAddon.outputs.addonFileName }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Rust
        uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
          profile: minimal

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install pre-commit scons markdown

      - name: Run Rust tests
        run: |
          cargo test --manifest-path rust_mcp_bridge/Cargo.toml

      - name: Build add-on package
        run: |
          scons

      - name: Find packaged add-on
        id: findAddon
        run: |
          $addon = Get-ChildItem -Path . -Filter *.nvda-addon | Select-Object -First 1
          if (-not $addon) { throw 'No .nvda-addon package was found' }
          echo "addonFileName=$($addon.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload add-on artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon
          path: ${{ steps.findAddon.outputs.addonFileName }}

  virus_total_scan:
    needs: package_addon
    runs-on: windows-latest
    permissions:
      contents: read
      issues: write
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      VT_API_LIMIT: ${{ vars.VT_API_LIMIT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download add-on artifact
        uses: actions/download-artifact@v4
        with:
          name: addon
          path: .

      - name: Rename add-on package
        run: |
          $found = Get-ChildItem -Path . -Filter *.nvda-addon -File | Select-Object -First 1
          if (-not $found) { throw 'No .nvda-addon package was found' }
          Rename-Item -Path $found.FullName -NewName addon.nvda-addon

      - name: Install virusTotal CLI
        run: choco install vt-cli -y

      - name: Run VirusTotal analysis
        id: runVirusTotalAnalysis
        uses: actions/github-script@v7
        with:
          script: |
            const runVirusTotalAnalysis = require('./.github/workflows/virusTotalAnalysis.js');
            runVirusTotalAnalysis({core}, ["addon.nvda-addon"]);

      - name: Upload VirusTotal results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: virus-total-results
          path: vt-results.json

  scan:
    needs: package_addon
    uses: ./.github/workflows/codeql-analysis.yml
    with:
      addonFileName: ${{ needs.package_addon.outputs.addonFileName }}
      branchName: ${{ github.event.pull_request.head.ref || github.ref_name }}
    permissions:
      actions: read
      contents: read
      security-events: write
      issues: write
